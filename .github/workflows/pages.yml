name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Stamp every ?v= on CSS/JS links with the commit so phones fetch the new build
      - name: Cache-bust asset links
        run: |
          v="${GITHUB_SHA::7}"
          sed -i -E "s/\?v=[A-Za-z0-9]+\"/?v=$v\"/g" index.html
          grep -c "?v=$v\"" index.html
      - name: Build site folder
        run: |
          mkdir _site
          cp -r index.html *.js *.css assets _site/
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
