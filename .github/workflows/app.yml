name: app
on:
  workflow_dispatch:
  push:
    branches: [app-tauri]
    paths: ['src-tauri/**', 'package.json', 'tools/build_web.mjs', '*.js', '*.css', 'index.html', '.github/workflows/app.yml']
  pull_request:
    paths: ['src-tauri/**', '.github/workflows/app.yml']

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci || npm install
      - run: node tools/engine_test.js
      - run: cargo test --manifest-path src-tauri/Cargo.toml --quiet
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: folio-windows (unsigned)
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - name: NDK
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: 'aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android' }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci || npm install
      - run: npx tauri android init --ci
      - run: npx tauri android build --debug --apk
      - uses: actions/upload-artifact@v4
        with:
          name: folio-android (debug key)
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
