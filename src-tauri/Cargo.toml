[package]
name = "folio"
version = "0.1.0"
description = "Folio: CPA-firm workbench"
edition = "2021"

[lib]
name = "folio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
zeroize = "1"
argon2 = "0.5"
hkdf = "0.12"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Foundation", "Security_Credentials", "Security_Cryptography", "Storage_Streams", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-keystore = { path = "plugins/keystore" }

# Argon2id (64 MB, 3 passes) is far too slow unoptimized: keep debug builds' unlock time close to release
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
