<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
  // Phone or tablet in "desktop site" mode (desktop user agent on a touch-only device): lay the page out at the
  // computer app's 1560 px width and let the browser zoom it to fit, instead of the phone layout.
  (() => {
    const ua = navigator.userAgent, uad = navigator.userAgentData;
    const mobileUa = uad ? uad.mobile : /Mobi|Android|iPhone|iPad|iPod/.test(ua);
    const touchOnly = navigator.maxTouchPoints > 0 && matchMedia('(pointer: coarse)').matches && !matchMedia('(any-pointer: fine)').matches;
    if (mobileUa || !touchOnly || Math.min(screen.width, screen.height) >= 1100) return;
    const W = 1560, html = document.documentElement;
    document.querySelector('meta[name="viewport"]').content = 'width=' + W;
    html.classList.add('desk-site');
    // Some browsers keep their own layout width in this mode: then run the CSS as if the window were 1560 px
    // (width media rules on/off by hand) and scale the page down to the screen.
    addEventListener('DOMContentLoaded', () => {
      if (innerWidth >= W - 40) return;
      for (const sh of document.styleSheets) {
        let rules; try { rules = sh.cssRules; } catch { continue; }
        for (const r of rules) {
          const t = r.media && r.media.mediaText; if (!t || !/width/.test(t)) continue;
          const mn = t.match(/min-width:\s*(\d+)px/), mx = t.match(/max-width:\s*(\d+)px/);
          r.media.mediaText = (!mn || W >= +mn[1]) && (!mx || W <= +mx[1]) ? 'all' : 'not all';
        }
      }
      html.style.width = W + 'px';
      html.style.zoom = innerWidth / W;
    });
  })();
</script>

<!-- screens are filled by app.js: stay hidden until the first render so nothing jumps (3 s fallback if JS fails) -->
<script>document.documentElement.classList.add('booting'); setTimeout(() => document.documentElement.classList.remove('booting'), 3000);</script>

<body>
<div class="app">

  <header class="bar">
    <a class="brand" href="#/" data-i18n-label="home"><span class="logo"><svg viewBox="0 0 44 44" aria-hidden="true"><path fill="#a8714a" d="M13 9.5h18.5v5.5H19v5.5h11v4.8H19v9.2h-6z"/><path stroke="#efe9dc" stroke-width="1.5" stroke-linecap="round" d="M22 28.5h9.5M22 31.5h9.5M22 34.5h9.5"/></svg></span><b class="word" aria-hidden="true">olio</b></a>
    <div class="settings">
      <div class="seg" role="radiogroup" data-i18n-label="language">
        <button role="radio" data-lang="fr" lang="fr-CA">FR</button>
        <button role="radio" data-lang="en" lang="en-CA">EN</button>
      </div>
      <button class="icon-btn" id="themeBtn" data-theme-toggle="1"></button>
    </div>
  </header>

  <nav class="nav" data-i18n-label="sections"></nav>

  <main class="main">
    <!-- landing -->
    <section class="screen landing" data-screen="home">
      <div class="land-hero">
        <div class="land-copy">
          <p class="kicker" data-i18n="kicker"></p>
          <h1 tabindex="-1" data-i18n="landTitle"></h1>
          <p class="lead" data-i18n="landLead"></p>
          <div class="cta">
            <a class="btn primary big" href="#/today"><span data-i18n="open"></span><i data-lucide="arrow-right"></i></a>
            <button class="btn soft big" type="button" data-tour="play"><i data-lucide="play"></i><span data-i18n="playDemo"></span></button>
            <a class="link" href="#how" data-i18n="how"></a>
          </div>
        </div>
        <div class="land-visual" aria-hidden="true">
        <img class="land-art day" src="assets/hero.jpg" alt="" width="1024" height="1024">
        <img class="land-art night" src="assets/hero-dark.jpg" alt="" width="1024" height="1024" loading="lazy">
        <div class="phone">
          <div class="phone-screen">
            <p class="ph-date" id="phDate"></p>
            <p class="ph-title" data-i18n="todayTitle"></p>
            <div class="ph-row"><span class="dot red"></span><span data-i18n="phRow1"></span></div>
            <div class="ph-row"><span class="dot amber"></span><span data-i18n="phRow2"></span></div>
            <div class="ph-row done"><span class="dot"></span><span data-i18n="phRow3"></span></div>
            <span class="ph-btn" data-i18n="phBtn"></span>
          </div>
        </div>
        </div>
      </div>
      <ul class="benefits" id="how"></ul>
      <p class="foot" data-i18n="demo"></p>
    </section>

    <!-- app screens: one clear thing each -->
    <section class="screen" data-screen="today">
      <p class="kicker" id="date"></p>
      <h1 tabindex="-1" id="greet"></h1>
      <div class="card answer">
        <svg viewBox="0 0 120 120" class="ring" aria-hidden="true">
          <circle cx="60" cy="60" r="50" class="ring-bg"/><circle cx="60" cy="60" r="50" class="ring-fg" id="ring"/>
        </svg>
        <div><b class="huge num" id="todayCount"></b><p id="todayLine"></p></div>
      </div>
      <ul class="tasks" id="tasks"></ul>
      <a class="link" href="#/deadlines"><i data-lucide="calendar-clock"></i><span data-i18n="allDeadlines"></span></a>
    </section>

    <section class="screen" data-screen="auto">
      <h1 tabindex="-1" data-i18n="autoTitle"></h1>
      <p class="lead" data-i18n="autoLead"></p>
      <div id="autoFeed"></div>
      <div id="autoOut" class="auto-out"></div>
      <input type="file" id="fileIn" accept=".csv,.tsv,.txt,text/csv" multiple hidden>
    </section>

    <section class="screen" data-screen="review">
      <h1 tabindex="-1" data-i18n-tp="review.title"></h1>
      <p class="lead" data-i18n-tp="review.lead"></p>
      <div id="rvOut"></div>
    </section>

    <section class="screen" data-screen="calendar">
      <h1 tabindex="-1" data-i18n-tp="cal.title"></h1>
      <p class="lead" data-i18n-tp="cal.lead"></p>
      <div id="calOut"></div>
    </section>

    <section class="screen" data-screen="engine">
      <h1 tabindex="-1" data-i18n-tp="eng.title"></h1>
      <p class="lead" data-i18n-tp="eng.lead"></p>
      <div id="engOut"></div>
    </section>

    <section class="screen" data-screen="deadlines">
      <h1 tabindex="-1" data-i18n="deadlines"></h1>
      <p class="lead" data-i18n="deadlinesLead"></p>
      <div id="dlNext"></div>
      <h2 data-i18n="later"></h2>
      <ul class="list" id="dlList"></ul>
    </section>

    <section class="screen" data-screen="clients">
      <h1 tabindex="-1" id="clientsTitle" data-i18n="clients"></h1>
      <div class="seg wide" role="radiogroup" id="clientFilter" data-i18n-label="clients"></div>
      <ul class="list" id="files"></ul>
    </section>

    <section class="screen" data-screen="money">
      <h1 tabindex="-1" data-i18n="money"></h1>
      <div class="card answer">
        <div><p data-i18n="owed"></p><b class="huge num" id="owed"></b>
          <div class="split" id="split" role="img"></div>
          <p class="legend"><span><i class="dot"></i><span id="onTime"></span></span><span><i class="dot red"></i><span id="lateAmt"></span></span></p>
        </div>
      </div>
      <h2 data-i18n="chase"></h2>
      <ul class="list" id="chaseList"></ul>
      <div class="card bank">
        <span class="ic"><i data-lucide="landmark"></i></span>
        <div><b id="bankLine"></b><p class="muted" data-i18n="bankHint"></p></div>
        <button class="btn primary" id="matchBtn" data-match="1"></button>
      </div>
    </section>

    <section class="screen" data-screen="close">
      <h1 tabindex="-1" id="closeTitle"></h1>
      <p class="lead" data-i18n="closeLead"></p>
      <div class="card answer">
        <div class="grow"><b class="huge num" id="closeCount"></b>
          <span class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="closeBar"><span></span></span></div>
      </div>
      <ul class="checks" id="checks"></ul>
    </section>
    <section class="screen" data-screen="engagements">
      <h1 tabindex="-1" data-i18n-tf="eng.title"></h1>
      <p class="lead" data-i18n-tf="eng.lead"></p>
      <div class="seg wide" role="radiogroup" id="engFilter" data-i18n-label="sections"></div>
      <ul class="list eng-list" id="engList"></ul>
    </section>

    <section class="screen wide-screen" data-screen="yearend">
      <h1 tabindex="-1" data-i18n-tf="ye.title"></h1>
      <div id="yeOut"></div>
    </section>

    <section class="screen" data-screen="requests">
      <h1 tabindex="-1" data-i18n-tf="req.title"></h1>
      <p class="lead" data-i18n-tf="req.lead"></p>
      <div id="pbcOut" class="pbc-grid"></div>
    </section>

    <section class="screen wide-screen" data-screen="time">
      <h1 tabindex="-1" data-i18n-tf="time.title"></h1>
      <p class="lead" data-i18n-tf="time.lead"></p>
      <div id="timeOut"></div>
    </section>

    <section class="screen" data-screen="more">
      <h1 tabindex="-1" data-i18n-tf="more.title"></h1>
      <p class="lead" data-i18n-tf="more.lead"></p>
      <ul class="more-grid" id="moreOut"></ul>
    </section>

  </main>
</div>

<div class="toast" id="toast" role="status"><span id="toastMsg"></span><button class="toast-undo" id="toastUndo" hidden></button></div>

<script src="engagement-add.js?v=20261026d"></script>
<script src="firm.js?v=20261026d"></script>
<script src="firm-time.js?v=20261026d"></script>

</body>
